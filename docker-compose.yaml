version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_orders
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - orders_network

  app:
    build: .
    container_name: orders_app
    ports:
      - "8080:8080"
      - "50051:50051"
      - "8081:8081"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: orders
    networks:
      - orders_network

volumes:
  mysql_data:

networks:
  orders_network:
    driver: bridge